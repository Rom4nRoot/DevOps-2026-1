# Настройки поиска секретов (gitleaks). Критический файл приёмки.
title = "Music Store gitleaks"

[extend]
useDefault = true

[allowlist]
# Исключены только каталоги, которые создаются сборкой и не содержат исходный код проекта.
# Добавлять сюда исходники, тесты или конфигурацию запрещено (CONTRIBUTING.md, раздел 2).
description = "Генерируемые каталоги: окружение Python, кэши и отчёты"
paths = [
  '''(^|/)venv/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.ci-cache/''',
  '''(^|/)\.trivycache/''',
  '''(^|/)reports/''',
  '''(^|/)\.git/''',
]
